[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finekot"
version = "0.1.0"
description = "Client for the Finekot API: 89 pay-per-call services for AI agents (screenshots, scraping, PDF, OCR, TTS, STT, invoices, KYC)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Finekot Systems" }]
keywords = ["finekot", "api", "mcp", "agents", "screenshot", "scraping", "pdf", "ocr", "tts", "stt"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://api.finekot.com"
Documentation = "https://api.finekot.com/llms.txt"
Source = "https://github.com/denyskot1986/finekot-api-mcp"

[tool.setuptools]
packages = ["finekot"]
